[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "{{TOOLKIT_NAME}}"
version = "0.1.0"
description = "Documentation-first toolkit for {{PRIMARY_OBJECT}}."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
